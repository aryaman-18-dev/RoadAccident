<!doctype html>
<html>
  <head>
    <title>AI Accident Risk Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        margin: 0;
      }

      /* NAVBAR */

      header {
        background: #020617;
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
      }

      .logo {
        font-size: 20px;
        font-weight: bold;
      }

      nav a {
        color: white;
        margin-left: 25px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
      }

      nav a:hover {
        color: #22c55e;
      }

      /* PAGE */

      .container {
        max-width: 1100px;
        margin: auto;
        padding: 50px 20px;
      }

      /* TITLE */

      .title {
        text-align: center;
        font-size: 34px;
        margin-bottom: 40px;
      }

      /* STATS */

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 25px;
        border-radius: 14px;
        text-align: center;
        box-shadow:
          0 8px 25px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition: 0.3s;
      }

      .stat-card:hover {
        transform: translateY(-6px);
      }

      .stat-number {
        font-size: 34px;
        font-weight: bold;
        margin-top: 10px;
      }

      .high {
        color: #ef4444;
      }
      .medium {
        color: #facc15;
      }
      .low {
        color: #22c55e;
      }

      /* CHART */

      .chart-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 16px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      /* FOOTER */

      footer {
        background: #020617;
        text-align: center;
        padding: 15px;
        margin-top: 60px;
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">🚦 Accident Severity AI</div>

      <nav>
        <a href="/">Home</a>
        <a href="/history">History</a>
        <a href="/analytics">Analytics</a>
        <a href="/admin">Admin</a>
      </nav>
    </header>

    <div class="container">
      <h1 class="title">📊 Accident Risk Analytics</h1>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>High Risk</h3>
          <div class="stat-number high" id="highCount">0</div>
        </div>

        <div class="stat-card">
          <h3>Medium Risk</h3>
          <div class="stat-number medium" id="mediumCount">0</div>
        </div>

        <div class="stat-card">
          <h3>Low Risk</h3>
          <div class="stat-number low" id="lowCount">0</div>
        </div>
      </div>

      <div class="chart-card">
        <canvas id="riskChart"></canvas>
      </div>
    </div>

    <script>

      /* DATA FROM FLASK */

      var risks = {{ risks | tojson }};

      /* COUNTERS */

      var high = 0;
      var medium = 0;
      var low = 0;

      /* UK DATASET SEVERITY MAPPING */

      for(let r of risks){

      if(!r) continue;

      /* normalize text */

      r = r.toString().trim().toLowerCase();

      /* fatal = high risk */

      if(r.includes("fatal")){
      high++;
      }

      /* serious = medium risk */

      else if(r.includes("serious")){
      medium++;
      }

      /* slight = low risk */

      else if(r.includes("slight")){
      low++;
      }

      }

      /* UPDATE UI */

      document.getElementById("highCount").innerText = high;
      document.getElementById("mediumCount").innerText = medium;
      document.getElementById("lowCount").innerText = low;

      /* BAR CHART */

      new Chart(document.getElementById("riskChart"),{

      type:"bar",

      data:{

      labels:["High Risk (Fatal)","Medium Risk (Serious)","Low Risk (Slight)"],

      datasets:[{

      label:"Accident Severity Distribution",

      data:[high,medium,low],

      backgroundColor:[
      "#ef4444",
      "#facc15",
      "#22c55e"
      ],

      borderRadius:8

      }]

      },

      options:{

      plugins:{
      legend:{
      labels:{
      color:"white",
      font:{size:14}
      }
      }
      },

      scales:{

      x:{
      ticks:{color:"white"},
      grid:{color:"rgba(255,255,255,.08)"}
      },

      y:{
      beginAtZero:true,
      ticks:{color:"white"},
      grid:{color:"rgba(255,255,255,.08)"}
      }

      }

      }

      });
    </script>

    <footer>© 2026 Accident Severity AI</footer>
  </body>
</html>
